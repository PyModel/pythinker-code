<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Pythinker Code  AI coding agent for your terminal">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152238"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a101c"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#1783ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1783ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="82%" cy="78%" r="42%">
      <stop offset="0%" stop-color="#EE9983" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#EE9983" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      .grid-dot { fill: #ffffff; opacity: 0.04; }
      .accent-line { animation: pulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect width="1200" height="320" fill="url(#warm)"/>

  <!-- subtle grid -->
  <g>
    <circle class="grid-dot" cx="80" cy="40" r="1.2"/>
    <circle class="grid-dot" cx="160" cy="40" r="1.2"/>
    <circle class="grid-dot" cx="240" cy="40" r="1.2"/>
