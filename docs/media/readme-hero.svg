  <!-- wordmark -->
  <g transform="translate(96, 88)">
    <text font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" letter-spacing="0.14em" fill="#AFE3F1">PYTHINKER CODE</text>
    <text y="62" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700" letter-spacing="-0.02em" fill="#F8FAFC">Next-gen agents</text>
    <text y="118" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700" letter-spacing="-0.02em" fill="#F8FAFC">in your terminal</text>
    <rect class="accent-line" y="148" width="120" height="3" rx="1.5" fill="#EE9983"/>
    <text y="188" font-family="ui-monospace, 'JetBrains Mono', ui-monospace, monospace" font-size="17" fill="#94A3B8">Reads code ù edits files ù runs tools ù ships results</text>
  </g>

  <!-- corner badge -->
  <g transform="translate(1010, 36)">
    <rect width="130" height="36" rx="8" fill="#1783ff" fill-opacity="0.12" stroke="#1783ff" stroke-opacity="0.35"/>
    <text x="65" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#58A6FF">Open Source</text>
