name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Smoke test CLI bundle
        run: pnpm -C apps/pythinker-code run smoke

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run test --shard=${{ matrix.shard }}/5

  test-complete:
    name: test
    if: always()
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Verify all test shards passed
        if: needs.test.result != 'success'
        run: exit 1

  # pi-tui's suite runs on node:test (not vitest), so the root `pnpm run test`
  # does not execute it; it needs its own job.
  test-pi-tui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pymodel/pi-tui test

  test-windows:
    runs-on: windows-latest
    # Temporarily disabled while Windows tests are being stabilized.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Windows runners are slower and run the whole suite (including
      # in-process e2e tests) under more contention, so the default 5s test
      # timeout causes flaky failures. Give it more headroom.
      - run: pnpm run test -- --testTimeout=30000

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run sherif

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm dlx --package @typescript/native-preview@beta tsgo --version
          for config in packages/*/tsconfig.json apps/pythinker-code/tsconfig.json; do
            echo "Typechecking ${config}"
            pnpm dlx --package @typescript/native-preview@beta tsgo -p "${config}" --noEmit
          done
      - name: Typecheck VS Code extension
        run: pnpm --filter pythinker-code run typecheck
      - name: Typecheck pythinker-web (vue-tsc)
        run: pnpm --filter @pymodel/pythinker-web run typecheck
      - name: Typecheck dashboard-server
        run: pnpm --filter @pymodel/dashboard-server run typecheck
      - name: Typecheck dashboard-web
        run: pnpm --filter @pymodel/dashboard-web run typecheck
      - name: Typecheck desktop
        run: pnpm --filter @pymodel/pythinker-desktop run typecheck
