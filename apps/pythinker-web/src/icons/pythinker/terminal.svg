<svg class="ptx ptx-terminal" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated terminal icon">
  <style>
    .ptx-terminal .terminal-shell,
    .ptx-terminal .terminal-divider,
    .ptx-terminal .prompt,
    .ptx-terminal .typed-line,
    .ptx-terminal .cursor {
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .ptx-terminal .terminal-shell {
      stroke-width: 1.75;
    }

    .ptx-terminal .terminal-divider {
      stroke-width: 1.45;
      opacity: .88;
    }

    .ptx-terminal .traffic-dot {
      fill: currentColor;
      opacity: .78;
      transform-box: fill-box;
      transform-origin: center;
      animation: ptx-term-dot-pulse 2.8s ease-in-out infinite;
    }

    .ptx-terminal .dot-2 { animation-delay: .12s; }
    .ptx-terminal .dot-3 { animation-delay: .24s; }

    .ptx-terminal .prompt {
      stroke-width: 1.55;
      path-length: 1;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: ptx-term-draw-prompt 2.8s ease-in-out infinite;
    }

    .ptx-terminal .typed-line {
      stroke-width: 1.3;
      path-length: 1;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      opacity: 0;
      animation: ptx-term-type-line 2.8s ease-in-out infinite;
    }

    .ptx-terminal .line-1 { animation-delay: .24s; }
    .ptx-terminal .line-2 { animation-delay: .46s; }

    .ptx-terminal .cursor {
      stroke-width: 1.45;
      animation: ptx-term-blink-cursor .92s steps(1, end) infinite;
    }

    @keyframes ptx-term-draw-prompt {
      0%, 8% {
        stroke-dashoffset: 1;
        opacity: 0;
      }
      24%, 72% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      88%, 100% {
        stroke-dashoffset: -1;
        opacity: 0;
      }
    }

    @keyframes ptx-term-type-line {
      0%, 16% {
        stroke-dashoffset: 1;
        opacity: 0;
      }
      34%, 70% {
        stroke-dashoffset: 0;
        opacity: .78;
      }
      86%, 100% {
        stroke-dashoffset: -1;
        opacity: 0;
      }
    }

    @keyframes ptx-term-blink-cursor {
      0%, 46% { opacity: .95; }
      47%, 100% { opacity: .18; }
    }

    @keyframes ptx-term-dot-pulse {
      0%, 100% { opacity: .66; transform: scale(.94); }
      42%, 58% { opacity: .92; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ptx-terminal .traffic-dot,
      .ptx-terminal .prompt,
      .ptx-terminal .typed-line,
      .ptx-terminal .cursor {
        animation: none;
      }

      .ptx-terminal .prompt,
      .ptx-terminal .typed-line {
        stroke-dashoffset: 0;
        opacity: .82;
      }

      .ptx-terminal .cursor { opacity: .78; }
      .ptx-terminal .traffic-dot { opacity: .78; transform: none; }
    }
  </style>

  <!-- Minimal terminal frame -->
  <rect class="terminal-shell" x="2.75" y="3.75" width="18.5" height="16.5" rx="3.15"/>
  <path class="terminal-divider" d="M3.2 8.15H20.8"/>

  <!-- macOS-style traffic-light dots, kept monochrome with currentColor -->
  <circle class="traffic-dot dot-1" cx="5.55" cy="5.95" r=".62"/>
  <circle class="traffic-dot dot-2" cx="7.75" cy="5.95" r=".62"/>
  <circle class="traffic-dot dot-3" cx="9.95" cy="5.95" r=".62"/>

  <!-- Animated terminal content -->
  <path class="prompt" pathLength="1" d="M6.35 11.15L8.65 13L6.35 14.85"/>
  <path class="typed-line line-1" pathLength="1" d="M10.2 12.15H16.6"/>
  <path class="typed-line line-2" pathLength="1" d="M10.2 15.25H14.25"/>
  <path class="cursor" d="M15.45 15.25H17.45"/>
</svg>
