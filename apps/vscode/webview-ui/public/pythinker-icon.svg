<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="color: #FFFFFF;" xmlns="http://www.w3.org/2000/svg">
  <!-- Antenna: hollow ring + stem -->
  <circle cx="12" cy="4" r="1.8" stroke="currentColor" stroke-width="1.3" fill="none" />
  <line x1="12" y1="5.8" x2="12" y2="8.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />

  <!-- Ears: hollow rectangular pods -->
  <rect x="1.5" y="11.5" width="2.3" height="5" rx="1" stroke="currentColor" stroke-width="1.3" fill="none" />
  <rect x="20.2" y="11.5" width="2.3" height="5" rx="1" stroke="currentColor" stroke-width="1.3" fill="none" />

  <!-- Head: soft rounded rectangle -->
  <rect x="3.8" y="8.5" width="16.4" height="11.5" rx="3" stroke="currentColor" stroke-width="1.3" fill="none" />

  <!-- Eyes: SOLID filled dots -->
  <circle cx="8.8" cy="13.2" r="1.2" fill="currentColor" stroke="none" />
  <circle cx="15.2" cy="13.2" r="1.2" fill="currentColor" stroke="none" />

  <!-- Tiny concave small smile -->
  <path d="M 10.2 16.5 Q 12 17.5 13.8 16.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none" />
</svg>
